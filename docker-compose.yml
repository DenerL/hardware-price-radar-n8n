version: "3.8"

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: meu-n8n
    restart: unless-stopped

    ports:
      - "5678:5678"

    env_file:
      - .env

    environment:
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false

    user: "root"

    volumes:
      - ./n8n_data:/home/node/.n8n